# Generated by make-bundle.sh for node ${OTTER_LABEL}. See docs/11-deployment.md §5.4.
data_dir      = "/var/lib/otter"
node_key      = "/etc/otter/node.key"
network_pub   = "${OTTER_NETWORK_PUB}"
manifest_file = "/etc/otter/manifest.bin"
log_level     = "info"

[wss]
listen   = ":${OTTER_PORT}"
path     = "${OTTER_PATH}"
tls_cert = "/etc/otter/tls.crt"
tls_key  = "/etc/otter/tls.key"
site_dir = "/var/lib/otter/site"

# Blob limits (photos, D44) and replication bandwidth for blob chunks (D45). Defaults shown.
# [limits]
# user_quota = "2GiB"     # live blobs per member
# max_blob   = "100MiB"   # one blob (protocol maximum)
# disk_floor = "1GiB"     # free space; below: no photos/backups; below 1/4: no messages either (D118)
# conns_per_ip    = 32    # concurrent connections per source address (IPv6: per /64); loopback exempt (D116)
# requests_per_ip = 50    # client requests per second per source, burst 10x (D116)
#
# [replication]
# blob_bandwidth = "2MB/s"  # background chunk pulls from peers; "0" = unlimited

# Push wake-ups (M5, D59). Push is off while the file is missing; deploy/push-key.sh installs it.
[push]
fcm_credentials = "/etc/otter/fcm.json"
