syntax = "proto3";
package otter.v1;

option go_package = "ottermsg/server/internal/proto/otterv1;otterv1";
option java_package = "app.ottermsg.proto.v1";
option java_multiple_files = true;

message Content {
  oneof body {
    DataMessage data = 1;
    ReceiptMessage receipt = 2;
    GroupUpdate group_update = 3;
    SenderKeyDistribution sender_key = 4;
    SessionReset session_reset = 5;
  }
  int64 sent_ms = 10;
}

message DataMessage {
  bytes message_id = 1; // 16 random bytes chosen by sender; receipts refer to it
  string text = 2;
  GroupContext group = 3; // set for group messages (sent as SENDER_KEY envelopes)
  repeated Attachment attachments = 4; // V1 sends at most one photo (D47); text is its caption
}

// An encrypted blob the receiver downloads (D46). Client-only: nodes never see it in plaintext.
message Attachment {
  bytes blob_key = 1;   // 32 bytes: record key of the BLOB_META
  bytes key = 2;        // 32-byte streaming AEAD key
  bytes digest = 3;     // SHA-256 of the whole ciphertext
  uint64 size = 4;      // ciphertext bytes
  string mime = 5;      // "image/jpeg"
  uint32 width = 6;
  uint32 height = 7;
  bytes thumbnail = 8;  // JPEG, long edge 64 px, <= 4 KiB
}

message GroupContext {
  bytes group_id = 1;
}

// Group state (M3). Travels only inside E2E content; nodes never see it.
message GroupState {
  bytes group_id = 1;         // 16 random bytes
  string name = 2;            // 1–64 chars, trimmed
  repeated bytes members = 3; // user ids, unique, 1–100
  repeated bytes admins = 4;  // subset of members, non-empty while members is non-empty
  uint64 version = 5;         // 1 at creation, +1 per change
  bool family = 6;            // D34, immutable
  bytes created_by = 7;       // immutable
  int64 created_ms = 8;       // immutable
}

// signature = Ed25519(signer account key, "otter-group-v1" || state)
message SignedGroupState {
  bytes state = 1; // serialized GroupState (signed as is)
  bytes signer = 2; // signer user id
  bytes signature = 3;
}

message GroupUpdate {
  SignedGroupState state = 1;
}

// A member's sender-key distribution message for one group and distribution id, sent 1:1.
message SenderKeyDistribution {
  bytes group_id = 1;
  bytes distribution_id = 2; // 16-byte UUID
  bytes message = 3;         // libsignal SenderKeyDistributionMessage
}

// Client-local storage of a group system event (messages.system_data); never sent.
message GroupEvent {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    CREATED = 1;
    ADDED = 2;
    REMOVED = 3;
    LEFT = 4;
    RENAMED = 5;
    ADMIN_GRANTED = 6;
    ADMIN_REVOKED = 7;
    YOU_WERE_REMOVED = 8;
    UNDECRYPTABLE = 9;
  }
  Type type = 1;
  bytes actor = 2;
  repeated bytes targets = 3;
  string name = 4;
}

message ReceiptMessage {
  enum Type {
    DELIVERED = 0;
    READ = 1;
  }
  Type type = 1;
  repeated bytes message_ids = 2;
}

// Sent 1:1 after a restore or when a message could not be decrypted (D53). No fields.
message SessionReset {}
