syntax = "proto3";
package otter.v1;

option go_package = "ottermsg/server/internal/proto/otterv1;otterv1";
option java_package = "app.ottermsg.proto.v1";
option java_multiple_files = true;

// Node-to-node frames on <secret path>/peer. Handshake: acceptor sends hello, dialer sends auth,
// acceptor answers auth_ok. Then both sides send subscribe and exchange batches.
message PeerFrame {
  oneof kind {
    PeerHello hello = 1;
    PeerAuth auth = 2;
    PeerAuthOk auth_ok = 3;
    PeerSubscribe subscribe = 4;
    PeerBatch batch = 5;
    PeerBatchAck batch_ack = 6;
    PeerError error = 7;
    PeerBlobGet blob_get = 8;
    PeerBlobChunk blob_chunk = 9;
    PeerHoldsQuery holds_query = 10;
    PeerHolds holds = 11;
    PeerTunnelOpen tunnel_open = 12;
    PeerTunnelData tunnel_data = 13;
    PeerTunnelAck tunnel_ack = 14;
    PeerTunnelClose tunnel_close = 15;
  }
}

message PeerHello {
  uint32 protocol_version = 1;
  bytes node_id = 2;
  bytes nonce = 3;
  uint64 manifest_version = 4;
}

// signature = Ed25519(node key, PeerAuthMessage(acceptor_id, acceptor_nonce, ts_ms))
message PeerAuth {
  bytes node_id = 1;
  int64 ts_ms = 2;
  bytes signature = 3;
  bytes nonce = 4; // challenge for the acceptor
  uint64 manifest_version = 5;
}

// signature = Ed25519(acceptor key, PeerAuthMessage(dialer_id, dialer_nonce, ts_ms))
message PeerAuthOk {
  int64 ts_ms = 1;
  bytes signature = 2;
}

message PeerSubscribe {
  int64 cursor = 1; // "send me your oplog entries with seq > cursor"
}

message PeerBatch {
  repeated bytes records = 1; // serialized Record
  int64 last_seq = 2;
  bool caught_up = 3;
}

message PeerBatchAck {
  int64 seq = 1;
}

message PeerError {
  string message = 1;
}

// Asks the peer for one chunk it holds (D45); answered by PeerBlobChunk with the same req.
message PeerBlobGet {
  uint64 req = 1;
  bytes blob_key = 2;
  uint32 index = 3;
}

message PeerBlobChunk {
  uint64 req = 1;
  bytes data = 2;
  bool missing = 3;
}

// A node marked no_backups asks whether the peer holds a backup record it wants to hand off (D113). For a BLOB_META
// "held" means every chunk is stored as well; a record this node received and later deleted as superseded also counts.
message PeerHoldsQuery {
  uint64 req = 1;
  bytes record_key = 2;
}

message PeerHolds {
  uint64 req = 1;
  bool held = 2;
}

// Restore tunnel (D114): opened by a node marked no_backups for a phone; the bytes are the phone's TLS stream to the
// receiving node. It rides on the existing peer session, whichever side dialed it (D132).
message PeerTunnelOpen {
  uint64 stream = 1;
}

message PeerTunnelData {
  uint64 stream = 1;
  bytes data = 2; // 1..32768 bytes
}

// The receiver consumed `chunks` data frames; the sender may have at most 32 unacknowledged.
message PeerTunnelAck {
  uint64 stream = 1;
  uint32 chunks = 2;
}

message PeerTunnelClose {
  uint64 stream = 1;
  string reason = 2;
}
