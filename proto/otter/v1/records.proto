syntax = "proto3";
package otter.v1;

option go_package = "ottermsg/server/internal/proto/otterv1;otterv1";
option java_package = "app.ottermsg.proto.v1";
option java_multiple_files = true;

enum RecordType {
  RECORD_TYPE_UNSPECIFIED = 0;
  DIRECTORY_ENTRY = 1;
  PREKEYS = 2;
  INVITE = 3;
  INVITE_USED = 4;
  ENVELOPE = 5;
  ACK = 6;
  PREKEY_CONSUMED = 7;
  PUSH_TOKEN = 8;
  BLOB_META = 9;
  BACKUP_META = 10;
  MANIFEST = 11;
  REVOCATION = 12;
  INVITE_RIGHTS = 13;
  BLOB_FETCHED = 14;
  ANNOUNCEMENT = 15;
  ANNOUNCEMENT_DELETED = 16;
  INSTALL = 17;               // M9.1 (C14): the account's current install, signed by the account key
  REKEY = 18;                 // M9.3 (D111): network-signed, a lost account replaced by a new one
}

// Signature is Ed25519 over the exact `body` bytes.
message Record {
  bytes body = 1;
  bytes signature = 2;
}

message RecordBody {
  bytes id = 1;          // 16 random bytes, unique per author
  RecordType type = 2;
  bytes author = 3;      // user_id | node_id | network_id (16 bytes)
  int64 created_ms = 4;
  int64 expires_ms = 5;  // 0 = never
  bytes payload = 6;
}

message DirectoryEntry {
  bytes user_id = 1;
  string username = 2;
  string display_name = 3;
  bytes account_pub = 4;   // Ed25519, 32 bytes
  bytes identity_pub = 5;  // libsignal serialized Curve25519 (33 bytes, 0x05 prefix)
  bytes identity_sig = 6;  // XEdDSA by identity key over account_pub (checked by clients)
  uint64 version = 7;
  bool can_invite = 8;
  int64 registered_ms = 9; // first registration (copied into later versions); username clash rank (D40). 0 = record created_ms
  bytes invite_record = 10; // M9.2 (D100): the inviter's signed INVITE Record (serialized); copied into later versions
  bytes invite_proof = 11;  // M9.2 (D100): Ed25519 by the invite's redeem key over RedeemMessage(invite_id, user_id, account_pub)
  bool listed = 12;          // M9.5 (D135): «Показывать меня в каталоге сети»; signed by the account, default off
}

message Revocation {
  bytes user_id = 1;
  string reason = 2;
}

// REKEY payload (M9.3, D111): signed by the network key. old_user_id is revoked; new_user_id takes over its username
// and clash rank, and contacts move their chats to it. Two REKEYs of one old_user_id: the later created_ms wins.
message Rekey {
  bytes old_user_id = 1;
  bytes new_user_id = 2;
}

message InviteRights {
  bytes user_id = 1;
  bool can_invite = 2;
  uint64 version = 3;
}

message Invite {
  bytes invite_id = 1;   // SHA-256(secret)
  int64 expires_ms = 2;
  bytes redeem_pub = 3;  // M9.2 (D100): Ed25519 public key of HKDF-SHA256(secret, "otter/invite-redeem/v1")
}

message InviteUsed {
  bytes invite_id = 1;
  bytes user_id = 2;
}

// Payload of PREKEY_CONSUMED (author = the node that handed the key out).
message PrekeyConsumed {
  bytes user_id = 1;
  uint32 device_id = 2;
  repeated uint32 key_ids = 3;
}

message Ack {
  // Record keys (author || id, 32 bytes) of acknowledged ENVELOPE records.
  repeated bytes envelope_ids = 1;
  uint32 device_id = 2;
}

// BLOB_META: announces a blob. Its record key (author‖id) is the blob key (D44).
message BlobMeta {
  uint64 size = 1;                  // ciphertext bytes
  uint32 chunk_size = 2;            // 262144 in V1
  repeated bytes chunk_sha256 = 3;  // SHA-256 of every chunk, in order
  repeated bytes readers = 4;       // user ids allowed to fetch; not the author
  bool persistent = 5;              // backup blob: no readers, no expiry (D50)
}

// BLOB_FETCHED: authored by a reader after a verified download (D45).
message BlobFetched {
  bytes blob_key = 1;
}

// BACKUP_META: the author's current password backup (D50). Latest version wins.
message BackupMeta {
  uint64 version = 1;
  bytes salt = 2;            // 16 bytes, Argon2id salt
  uint32 kdf_m_kib = 3;      // 65536 in V1
  uint32 kdf_t = 4;          // 3
  uint32 kdf_p = 5;          // 1
  bytes auth_verifier = 6;   // SHA-256(auth_secret), 32 bytes
  bytes blob_key = 7;        // record key of the persistent BLOB_META (author ‖ id)
  uint64 size = 8;           // ciphertext bytes
}

// INSTALL payload (M9.1, C14). Signed by the account key. Per user the newest (installed_ms, registration_id) is the
// account's current install; a phone believes that another phone replaced it only from a valid INSTALL record.
message Install {
  uint32 registration_id = 1;  // 1..16380, the Signal registration id of this install
  int64 installed_ms = 2;      // when this install was created (registration, restore or "this phone is main again")
}

// PUSH_TOKEN payload (D60): the newest record per (author, device) is that device's push token.
message PushToken {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    FCM = 1;
  }
  uint32 device_id = 1;
  Kind kind = 2;
  string token = 3;       // 1–4096 bytes of UTF-8; empty exactly when withdrawn
  bool messages_off = 4;  // M9.1: notifications off on the phone: wake this device for calls only
  bool withdrawn = 5;     // M9.1: Google wake-ups off: nodes forget the token, no pushes at all
}

// ANNOUNCEMENT payload (D66). Author = ID16(news public key); signed by a news key listed in the manifest (D65).
message Announcement {
  string text_ru = 1;
  string text_en = 2;
  AppUpdate update = 3; // optional: an APK served by the nodes (D68)
}

message AppUpdate {
  string version_name = 1;
  uint32 version_code = 2;
  bytes sha256 = 3; // SHA-256 of the APK file
  uint64 size = 4;  // bytes
}

// ANNOUNCEMENT_DELETED payload: target = record key (author ‖ id) of the deleted announcement.
message AnnouncementDeleted {
  bytes target = 1;
}
